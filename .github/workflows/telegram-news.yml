name: Telegram News Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and publish Telegram news
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          CHANNEL_USERNAME: Offsideahdaff
          ADDITIONAL_CHANNELS: Erupean_sportt,infosportz,infosportsplus
          CHANNEL_SOURCE_NAMES: Offsideahdaff=Offside,Erupean_sportt=European Sport,infosportz=Info Sportz,infosportsplus=Info Sports Plus
          BACKEND_NEWS_ENDPOINT: ${{ secrets.BACKEND_NEWS_ENDPOINT }}
          SOURCE_NAME: Offside
          LATEST_POST_LIMIT: "15"
          COMPRESS_IMAGES: "true"
          IMAGE_MAX_WIDTH: "1280"
          IMAGE_QUALITY: "76"
          RUN_ONCE: "true"
        run: python main.py
